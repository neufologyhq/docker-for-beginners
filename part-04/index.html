<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neufology Notes · Docker Part 4</title>
<style>
:root{color-scheme:dark;font:22px/1.5 system-ui,sans-serif;color:#f3f3ef;background:#222528}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 35% 20%,#30363a,transparent 75%)}main{max-width:1120px;margin:auto;padding:36px 48px}header{display:flex;align-items:center;justify-content:space-between;color:#b4bcc2;font-size:16px;letter-spacing:.12em}header strong{color:#f3f3ef;border-left:5px solid #18bbdd;padding-left:16px}h1{font-size:58px;line-height:1.1;letter-spacing:-.045em;margin:32px 0 8px}p{color:#b4bcc2;margin:0 0 28px}.workspace{display:grid;grid-template-columns:1fr 1fr;gap:24px}section{background:#1b1f22;border:1px solid #465158;border-radius:18px;padding:28px}label,.label{display:block;font-size:16px;text-transform:uppercase;letter-spacing:.09em;color:#aebbc2;margin-bottom:16px}textarea{display:block;width:100%;height:146px;background:#292e32;border:1px solid #616e77;border-radius:10px;padding:16px;font:24px/1.45 system-ui;color:#fff;resize:none}textarea:focus{outline:2px solid #18bbdd;outline-offset:2px}button{font:600 20px system-ui;background:#18bbdd;color:#10252c;border:0;border-radius:9px;padding:13px 28px;margin-top:19px;cursor:pointer}button:disabled{opacity:.6}#status{margin-left:16px;font-size:17px;color:#b9e9f3}#saved{font-size:29px;line-height:1.5;overflow-wrap:anywhere;min-height:156px}#saved.empty{color:#929da4;font-size:24px}footer{margin-top:27px;display:flex;justify-content:space-between;color:#aebbc2;font-size:17px}code{color:#dbe6eb;font:18px ui-monospace,monospace}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#18bbdd;margin-right:8px}
</style></head><body><main><header><strong>NEUFOLOGY</strong><span>DOCKER LAB / 04</span></header><h1>A little note. A useful test.</h1><p>Save a note, then see what survives.</p><div class="workspace"><section><label for="note">Your note</label><textarea id="note" maxlength="500" placeholder="Write something worth keeping…"></textarea><button id="save">Save</button><span id="status" role="status"></span></section><section><div class="label">Saved on the server</div><div id="saved" class="empty">Loading…</div></section></div><footer><span><span class="dot"></span>Server storage</span><code>/data/notes.json</code></footer></main>
<script>
const field=document.querySelector('#note'),saved=document.querySelector('#saved'),status=document.querySelector('#status'),button=document.querySelector('#save');
function show(data){saved.textContent=data.text||'No saved note yet.';saved.classList.toggle('empty',!data.text)}
fetch('/api/note',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(show).catch(()=>{saved.textContent='Cannot reach the server.'});
button.addEventListener('click',async()=>{button.disabled=true;status.textContent='Saving…';try{const r=await fetch('/api/note',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:field.value})});if(!r.ok)throw Error();show(await r.json());status.textContent='Saved.'}catch{status.textContent='Could not save.'}finally{button.disabled=false}});
</script></body></html>
